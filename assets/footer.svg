<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0b1b38"/>
      <stop offset="1" stop-color="#10305f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: "JetBrains Mono", "Fira Code", Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    .beam { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-340px); } to { transform: translateX(1240px); } }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="100" fill="url(#bg)"/>
  <rect x="0" y="28" width="1200" height="2" fill="#58a6ff" fill-opacity="0.25"/>
  <rect class="beam" x="0" y="27" width="340" height="4" fill="url(#beam)" filter="url(#glow)"/>

  <text x="600" y="68" font-size="15" fill="#8b949e" text-anchor="middle">// thanks for stopping by<tspan class="caret" fill="#58a6ff">_</tspan></text>
</svg>
